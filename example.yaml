openapi: 3.0.4
info:
  title: Movie Theater Seat Selection API
  description: This API lets a customer see which seats are open for a movie showtime, pick seats and hold them while they pay, and cancel the hold if they change their mind.
  version: 1.0.0

servers:
  - url: http://api.movietheater.com/v1
    description: Main server
    
paths:
  /showtimes/{showtimeId}/seats:
    get:
      summary: Get all the seats for a showtime.
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A list of seats and whether each one is open or taken
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    seatId:
                      type: string
                    available:
                      type: boolean
        "404":
          description: Showtime not found
 
  /showtimes/{showtimeId}/holds:
    post:
      summary: Hold seats for a showtime while the customer pays.
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                seatIds:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Seats were held
        "400":
          description: Bad request, no seats were picked
        "409":
          description: One of the seats is already taken
 
  /showtimes/{showtimeId}/holds/{holdId}:
    delete:
      summary: Cancel a seat hold.
      parameters:
        - name: showtimeId
          in: path
          required: true
          schema:
            type: string
        - name: holdId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Hold was cancelled
        "404":
          description: Hold not found
        "409":
          description: Seats were already paid for so the hold can't be cancelled